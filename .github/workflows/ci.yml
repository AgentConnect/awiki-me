name: CI

on:
  schedule:
    - cron: "40 18 * * *"
  workflow_dispatch:
    inputs:
      package_smoke_target:
        description: Select only an outstanding artifact smoke target
        required: false
        default: all
        type: choice
        options: [all, android-arm64]
      package_smoke_run:
        description: Passed Singapore package-app run to install and start without rebuilding
        required: false
        default: ''
        type: string
      cli_ref:
        description: Exact 40-character awiki-cli-rs2 commit SHA
        required: true
        type: string
      sdk_dependencies:
        description: Development dependency source (source uses a committed manifest and lock)
        required: false
        default: registry
        type: choice
        options: [source, registry]
      validation_only:
        description: Run deterministic validation and native build checks without remote account or OTP scenarios
        required: false
        default: false
        type: boolean
      verification_version:
        description: Optional numeric x.y.z Windows verification version (no suffix, no publication)
        required: false
        default: ''
        type: string
      verification_build:
        description: Windows verification installer build number
        required: false
        default: '44'
        type: string
      e2e_case:
        description: Audited remote product suite
        required: true
        default: full
        type: choice
        options: [full, direct, group, attachment, contacts]

permissions:
  contents: read
  actions: read

concurrency:
  group: awiki-me-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: false

env:
  PUB_HOSTED_URL: https://pub.dev
  FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
  AWIKI_SOURCE_INTEGRATION: ${{ inputs.sdk_dependencies == 'source' && '1' || '0' }}
  AWIKI_RELEASE_REGISTRY: ${{ inputs.sdk_dependencies == 'source' && '0' || '1' }}

# release/0910 App code already requires the Core processing-session API.
# Manual source runs supply an exact cli_ref; scheduled runs retain registry defaults.
jobs:
  validate:
    if: ${{ !inputs.package_smoke_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Require exact CLI / SDK source ref and private repository read token
        env:
          CLI_REF: ${{ github.event.inputs.cli_ref || 'c483b51500058ffc6dac2e9db5517a5df0ce1262' }}
          SYSTEM_TEST_READ_TOKEN: ${{ secrets.AWIKI_CI_READ_TOKEN }}
        run: |
          [[ "$CLI_REF" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Pinned Core ref (or workflow input) must be an exact commit SHA" >&2
            exit 1
          }
          test -n "$SYSTEM_TEST_READ_TOKEN" || {
            echo "AWIKI_CI_READ_TOKEN is missing; provide Contents: read access to awiki-system-test" >&2
            exit 1
          }

      - name: Checkout AWiki Me
        uses: actions/checkout@v6
        with:
          path: test-awiki-me

      - name: Checkout AWiki CLI / IM Core
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/awiki-cli-rs2
          ref: ${{ github.event.inputs.cli_ref || 'c483b51500058ffc6dac2e9db5517a5df0ce1262' }}
          token: ${{ github.token }}
          path: awiki-cli-rs2
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libsqlite3-dev xvfb dbus-x11

      - name: Enable Flutter Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Prepare SQLite source for Linux desktop build
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl --fail --location --continue-at - \
              --connect-timeout 20 --max-time 120 \
              --output /tmp/sqlite-autoconf-3520000.tar.gz \
              https://sqlite.org/2026/sqlite-autoconf-3520000.tar.gz && break
            if [ "$attempt" = "6" ]; then exit 1; fi
            sleep 5
          done
          mkdir -p /tmp/awiki-sqlite3
          tar -xzf /tmp/sqlite-autoconf-3520000.tar.gz \
            --strip-components=1 -C /tmp/awiki-sqlite3

      - name: Build debug native IM Core and CLI
        working-directory: awiki-cli-rs2
        run: |
          if [[ "$AWIKI_SOURCE_INTEGRATION" == "1" ]]; then
            python3 scripts/dependencies/build.py --deps source --source-manifest dependencies.source.json --cargo-command build -p im-core-dart -p awiki-cli --locked
            native_root=.artifacts/dependencies/source/target
          else
            python3 scripts/release/registry-build.py -- cargo build -p im-core-dart -p awiki-cli --locked
            native_root=target
          fi
          mkdir -p packages/awiki_im_core/linux/lib
          cp "$native_root/debug/libawiki_im_core.so" \
            packages/awiki_im_core/linux/lib/libawiki_im_core.so

      - name: Install Flutter dependencies
        working-directory: test-awiki-me
        run: flutter pub get

      - name: Verify Linux native Core provenance
        working-directory: test-awiki-me
        run: dart run tool/ensure_linux_im_core.dart --debug

      - name: Checkout unified System Test coordinator
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/awiki-system-test
          ref: a191665c8173dbcb6434d9484fa533f5de3321a4
          token: ${{ secrets.AWIKI_CI_READ_TOKEN }}
          path: test-awiki-system-test
          persist-credentials: false

      - name: Record exact CLI / SDK source ref
        env:
          CLI_REF: ${{ github.event.inputs.cli_ref || 'c483b51500058ffc6dac2e9db5517a5df0ce1262' }}
        run: |
          test "$(git -C awiki-cli-rs2 rev-parse HEAD)" = "$CLI_REF"
          git -C awiki-cli-rs2 rev-parse HEAD | tee /tmp/awiki-cli-ref
          git -C test-awiki-system-test rev-parse HEAD

      - name: Dart analyze
        working-directory: test-awiki-me
        run: dart analyze

      - name: Flutter unit/widget/provider gate
        working-directory: test-awiki-me
        run: |
          dart run tests/unit/runner.dart --branch-coverage
          dart run tool/test_coverage_gate.dart

      - name: Validate case catalog and generated documentation
        working-directory: test-awiki-me
        run: dart run tool/validate_test_catalog.dart

      - name: Real desktop smoke (no service dependency)
        working-directory: test-awiki-me
        env:
          AWIKI_SQLITE3_SOURCE_DIR: /tmp/awiki-sqlite3
        run: dart run tests/e2e/runner.dart --case smoke --run-id gha-smoke-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Product manifest orchestration lint only
        working-directory: test-awiki-me
        run: |
          cp tests/e2e/configs/e2e.example.yaml /tmp/awiki-e2e-dry-run.yaml
          sed -i 's/platform: macos/platform: linux/' /tmp/awiki-e2e-dry-run.yaml
          sed -i "s/0000000000000000000000000000000000000000/$(cat /tmp/awiki-cli-ref)/" /tmp/awiki-e2e-dry-run.yaml
          dart run tests/e2e/runner.dart --case full --dry-run \
            --config /tmp/awiki-e2e-dry-run.yaml \
            --run-id gha-dry-run-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run App PR profile alongside legacy gates
        working-directory: test-awiki-system-test
        env:
          AWIKI_SQLITE3_SOURCE_DIR: /tmp/awiki-sqlite3
          AWIKI_CLI_RUST_CARGO_TOOLCHAIN: '1.88.0'
        run: |
          uv sync --locked
          export AWIKI_CLI_SOURCE_REF="$(cat /tmp/awiki-cli-ref)"
          uv run --no-sync awiki-test \
            --profile pr --component app \
            --app-root ../test-awiki-me \
            --cli-root ../awiki-cli-rs2 \
            --run-id gha-pr-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload deterministic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: awiki-me-deterministic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-awiki-me/.e2e/*/*/reports/**
            test-awiki-me/.e2e/native-core/*-provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload unified profile report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: awiki-unified-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-awiki-system-test/.artifacts/awiki-test/
          if-no-files-found: error
          retention-days: 14

  cross-repository-contracts:
    if: ${{ !inputs.package_smoke_run }}
    name: Cross-repository System contracts
    runs-on: ubuntu-latest
    env:
      AWIKI_CLI_RUST_CARGO_TOOLCHAIN: '1.88.0'
      # Share the CLI/ACP development build profile; avoid large debug caches.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Require exact CLI / SDK source ref and private repository read token
        env:
          CLI_REF: ${{ github.event.inputs.cli_ref || 'c483b51500058ffc6dac2e9db5517a5df0ce1262' }}
          SYSTEM_TEST_READ_TOKEN: ${{ secrets.AWIKI_CI_READ_TOKEN }}
        run: |
          [[ "$CLI_REF" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "AWIKI_CLI_RS2_REF (or workflow input) must be an exact commit SHA" >&2
            exit 1
          }
          test -n "$SYSTEM_TEST_READ_TOKEN" || {
            echo "AWIKI_CI_READ_TOKEN is missing; provide Contents: read access to awiki-system-test, user-service, and awiki-web" >&2
            exit 1
          }

      - name: Checkout AWiki Me
        uses: actions/checkout@v6
        with:
          path: test-awiki-me

      - name: Checkout AWiki CLI / IM Core
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/awiki-cli-rs2
          ref: ${{ github.event.inputs.cli_ref || 'c483b51500058ffc6dac2e9db5517a5df0ce1262' }}
          token: ${{ github.token }}
          path: awiki-cli-rs2
          persist-credentials: false

      - name: Checkout unified System Test coordinator
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/awiki-system-test
          ref: a191665c8173dbcb6434d9484fa533f5de3321a4
          token: ${{ secrets.AWIKI_CI_READ_TOKEN }}
          path: test-awiki-system-test
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Checkout pinned DSH contract source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/dsh-awiki
          # Includes the reviewed await-before-ready Device Join driver fix.
          ref: 6c9cd866b217641ab78fc34cb31db1ce64754c25
          path: dsh-awiki
          persist-credentials: false

      - name: Checkout pinned User Service contract source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/user-service
          ref: 831cd43587baebe98f6aff9972d00e88850cdcd7
          token: ${{ secrets.AWIKI_CI_READ_TOKEN }}
          path: user-service
          persist-credentials: false

      - name: Checkout pinned Web contract source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/awiki-web
          ref: e0b9bf029338aa914169523ef09a729f58d8b028
          token: ${{ secrets.AWIKI_CI_READ_TOKEN }}
          path: awiki-web
          persist-credentials: false

      - name: Checkout pinned Desktop contract source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/deepseek-harness-desktop
          ref: 82c36f3d3c850fe376e8cc5de3d3e1d07ab59ccf
          path: deepseek-harness-desktop
          persist-credentials: false

      # Match the pinned System Test coordinator's update-wire fixtures.
      - name: Setup Node for cross-repository contracts
        uses: actions/setup-node@v6
        with:
          node-version: '24.12.0'

      - name: Install frozen DSH contract dependencies
        working-directory: dsh-awiki
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Install frozen Desktop contract dependencies
        working-directory: deepseek-harness-desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          node scripts/prepare-runtime-inputs.mjs
          corepack yarn install --immutable --mode=skip-build

      - name: Prepare canonical App source path for contracts
        run: ln -s test-awiki-me awiki-me

      - name: Install locked System Test dependencies
        working-directory: test-awiki-system-test
        run: uv sync --locked

      - name: Identify contract build cache inputs
        id: contract-cache
        working-directory: test-awiki-system-test
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib, json, os, platform, subprocess
          inputs = {
              "core": subprocess.check_output(["git", "-C", "../awiki-cli-rs2", "rev-parse", "HEAD"], text=True).strip(),
              "coordinator": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "python": platform.python_version(),
              "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "cargo": subprocess.check_output(["cargo", "--version"], text=True).strip(),
              "source": os.environ["AWIKI_SOURCE_INTEGRATION"],
              "registry": os.environ["AWIKI_RELEASE_REGISTRY"],
          }
          digest = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"fingerprint={digest}\n")
          PY

      - name: Restore contract dependencies and verified artifact cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            awiki-cli-rs2/.artifacts/dependencies/source/target
            awiki-cli-rs2/target
            test-awiki-system-test/.artifacts/awiki-test-cache
          key: contracts-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.contract-cache.outputs.fingerprint }}

      - name: Prepare source-matched CLI contract artifact
        working-directory: test-awiki-system-test
        env:
          # A cold hosted runner may download locked dependencies during prepare.
          AWIKI_CLI_RUST_CARGO_OFFLINE: '0'
        run: |
          export AWIKI_CLI_SOURCE_REF="$(git -C ../awiki-cli-rs2 rev-parse HEAD)"
          uv run --no-sync awiki-test \
            --profile pr --component system \
            --app-root ../test-awiki-me --cli-root ../awiki-cli-rs2 \
            --prepare-only \
            --run-id gha-contracts-prepare-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run cross-repository System PR contracts
        working-directory: test-awiki-system-test
        run: |
          export AWIKI_CLI_SOURCE_REF="$(git -C ../awiki-cli-rs2 rev-parse HEAD)"
          uv run --no-sync awiki-test \
            --profile pr --component system \
            --app-root ../test-awiki-me \
            --cli-root ../awiki-cli-rs2 \
            --run-id gha-contracts-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload unified profile report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: awiki-system-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-awiki-system-test/.artifacts/awiki-test/
          if-no-files-found: error
          retention-days: 14

  remote-product:
    if: ${{ !inputs.package_smoke_run && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.validation_only)) }}
    needs: [validate, cross-repository-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Require exact ref and remote account pool secrets
        env:
          CLI_REF: ${{ github.event.inputs.cli_ref || 'c483b51500058ffc6dac2e9db5517a5df0ce1262' }}
          E2E_PHONE: ${{ secrets.AWIKI_E2E_OTP_PHONE }}
          E2E_OTP: ${{ secrets.AWIKI_E2E_OTP_CODE }}
          APP_HANDLE: ${{ secrets.AWIKI_E2E_APP_HANDLE }}
          CLI_HANDLE: ${{ secrets.AWIKI_E2E_CLI_HANDLE }}
        run: |
          [[ "$CLI_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "$E2E_PHONE" && test -n "$E2E_OTP"
          test -n "$APP_HANDLE" && test -n "$CLI_HANDLE"

      - uses: actions/checkout@v6
        with:
          path: test-awiki-me

      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/awiki-cli-rs2
          ref: ${{ github.event.inputs.cli_ref || 'c483b51500058ffc6dac2e9db5517a5df0ce1262' }}
          token: ${{ github.token }}
          path: awiki-cli-rs2
          persist-credentials: false

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@1.88.0

      - name: Install Linux desktop dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libsqlite3-dev xvfb dbus-x11
          flutter config --enable-linux-desktop

      - name: Prepare SQLite source
        run: |
          curl --fail --location --connect-timeout 20 --max-time 180 \
            --output /tmp/sqlite.tar.gz \
            https://sqlite.org/2026/sqlite-autoconf-3520000.tar.gz
          mkdir -p /tmp/awiki-sqlite3
          tar -xzf /tmp/sqlite.tar.gz --strip-components=1 -C /tmp/awiki-sqlite3

      - name: Build audited debug artifacts
        working-directory: awiki-cli-rs2
        run: |
          if [[ "$AWIKI_SOURCE_INTEGRATION" == "1" ]]; then
            python3 scripts/dependencies/build.py --deps source --source-manifest dependencies.source.json --cargo-command build -p im-core-dart -p awiki-cli --locked
            native_root=.artifacts/dependencies/source/target
          else
            python3 scripts/release/registry-build.py -- cargo build -p im-core-dart -p awiki-cli --locked
            native_root=target
          fi
          mkdir -p packages/awiki_im_core/linux/lib
          cp "$native_root/debug/libawiki_im_core.so" \
            packages/awiki_im_core/linux/lib/libawiki_im_core.so

      - name: Install Flutter dependencies
        working-directory: test-awiki-me
        run: flutter pub get

      - name: Verify Linux native Core provenance
        working-directory: test-awiki-me
        run: dart run tool/ensure_linux_im_core.dart --debug

      - name: Write secret-backed awiki.info config
        working-directory: test-awiki-me
        env:
          CLI_REF: ${{ github.event.inputs.cli_ref || 'c483b51500058ffc6dac2e9db5517a5df0ce1262' }}
          E2E_PHONE: ${{ secrets.AWIKI_E2E_OTP_PHONE }}
          E2E_OTP: ${{ secrets.AWIKI_E2E_OTP_CODE }}
          APP_HANDLE: ${{ secrets.AWIKI_E2E_APP_HANDLE }}
          CLI_HANDLE: ${{ secrets.AWIKI_E2E_CLI_HANDLE }}
        run: |
          mkdir -p .e2e/ci
          python3 - <<'PY'
          import json, os
          config = {
              "platform": "linux",
              "service": {
                  "baseUrl": "https://awiki.info",
                  "userServiceUrl": "https://awiki.info",
                  "messageServiceUrl": "https://awiki.info",
                  "messageServiceWsUrl": "wss://awiki.info/im/ws",
                  "didDomain": "awiki.info",
                  "anpServiceUrl": "https://awiki.info/anp-im/rpc",
                  "anpServiceDid": "did:wba:awiki.info",
              },
              "otp": {"phone": os.environ["E2E_PHONE"], "code": os.environ["E2E_OTP"]},
              "accounts": {
                  "appUser": {"handle": os.environ["APP_HANDLE"]},
                  "cliPeer": {"handle": os.environ["CLI_HANDLE"]},
              },
              "cliPeer": {
                  "binary": "../awiki-cli-rs2/" + (".artifacts/dependencies/source/target" if os.environ.get("AWIKI_SOURCE_INTEGRATION") == "1" else "target") + "/debug/awiki-cli",
                  "sourceRef": os.environ["CLI_REF"],
              },
          }
          with open(".e2e/ci/remote.json", "w", encoding="utf-8") as handle:
              json.dump(config, handle)
          PY

      - name: Run real App to CLI product gate against awiki.info
        working-directory: test-awiki-me
        env:
          AWIKI_SQLITE3_SOURCE_DIR: /tmp/awiki-sqlite3
        run: |
          test "$(git -C ../awiki-cli-rs2 rev-parse HEAD)" = \
            "${{ github.event.inputs.cli_ref || 'c483b51500058ffc6dac2e9db5517a5df0ce1262' }}"
          dart run tests/e2e/runner.dart \
            --case "${{ github.event.inputs.e2e_case || 'full' }}" \
            --config .e2e/ci/remote.json \
            --run-id gha-remote-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload real product reports and residual ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: awiki-me-remote-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-awiki-me/.e2e/*/*/reports/**
            test-awiki-me/.e2e/native-core/*-provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  windows-pr:
    if: ${{ !inputs.package_smoke_run }}
    name: Windows x64 build and native smoke
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      WINDOWS_CORE_REF: ${{ github.event.inputs.cli_ref || 'c483b51500058ffc6dac2e9db5517a5df0ce1262' }}
    steps:
      - name: Require exact Core source ref
        shell: bash
        run: |
          [[ "$WINDOWS_CORE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "AWIKI_CLI_RS2_WINDOWS_REF must be an exact Core commit SHA" >&2
            exit 1
          }

      - name: Checkout AWiki Me
        uses: actions/checkout@v6
        with:
          path: test-awiki-me

      - name: Checkout pinned CLI / IM Core
        uses: actions/checkout@v6
        with:
          repository: AgentConnect/awiki-cli-rs2
          ref: ${{ env.WINDOWS_CORE_REF }}
          token: ${{ github.token }}
          path: awiki-cli-rs2
          persist-credentials: false

      - name: Verify exact CLI / IM Core checkout
        shell: pwsh
        run: |
          $actual = (git -C awiki-cli-rs2 rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:WINDOWS_CORE_REF) {
            throw "Core checkout is $actual, expected $env:WINDOWS_CORE_REF"
          }

      - name: Check Windows native build entrypoint
        working-directory: awiki-cli-rs2
        shell: pwsh
        run: ./scripts/flutter/test-build-windows.ps1

      - name: Setup Flutter 3.44.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install AWiki Me dependencies
        working-directory: test-awiki-me
        shell: pwsh
        run: flutter pub get

      - name: Verify Windows HTTPS trust and failure paths
        working-directory: test-awiki-me
        shell: pwsh
        run: |
          flutter test --no-pub tests/unit/windows_verification_version_test.dart tests/unit/app_http_client_test.dart tests/unit/registration_entry_test.dart tests/unit/registration_entry_widget_test.dart tests/unit/app_update_provider_test.dart tests/unit/data/services/app_update_service_test.dart tests/e2e/flutter/native/windows_https_trust_test.dart
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate verification metadata before native builds
        if: github.event_name == 'workflow_dispatch' && inputs.verification_version != ''
        working-directory: test-awiki-me
        shell: pwsh
        env:
          VERIFY_VERSION: ${{ inputs.verification_version }}
          VERIFY_BUILD: ${{ inputs.verification_build }}
        run: |
          dart tool/validate_windows_verification_version.dart $env:VERIFY_VERSION $env:VERIFY_BUILD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Run IM Core Rust host tests
        working-directory: awiki-cli-rs2
        shell: pwsh
        run: |
          $cargoArgs = @('+1.88.0', 'test', '-p', 'im-core-dart', '--locked', '--no-default-features', '--features', 'blocking,sqlite,http,windows,identity-native-anp')
          if ($env:AWIKI_SOURCE_INTEGRATION -eq '1') {
            python3 scripts/dependencies/build.py --deps source --source-manifest dependencies.source.json --cargo-command @cargoArgs
          } else {
            python3 scripts/release/registry-build.py -- cargo @cargoArgs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify x64 native IM Core
        working-directory: awiki-cli-rs2
        shell: pwsh
        run: ./scripts/flutter/build-windows.ps1

      - name: Run IM Core Flutter loader tests
        working-directory: awiki-cli-rs2/packages/awiki_im_core
        shell: pwsh
        run: |
          flutter pub get
          flutter test --no-pub test/native_library_loader_test.dart

      - name: Run Windows runner and package contract tests
        working-directory: test-awiki-me
        shell: pwsh
        run: |
          flutter test --no-pub tests/unit/windows_runner_configuration_test.dart
          flutter test --no-pub tests/unit/windows_installer_configuration_test.dart
          flutter test --no-pub tests/unit/package_manifest_test.dart
          flutter test --no-pub tests/unit/windows_scope_secret_integration_configuration_test.dart

      - name: Build Windows Debug
        working-directory: test-awiki-me
        shell: pwsh
        run: |
          flutter build windows `
            --debug `
            --no-pub `
            --dart-define=AWIKI_APP_SOURCE_REF=${{ github.sha }} `
            --dart-define=AWIKI_IM_CORE_SOURCE_REF=${{ env.WINDOWS_CORE_REF }}

      - name: Build Windows Release
        working-directory: test-awiki-me
        shell: pwsh
        env:
          VERIFY_VERSION: ${{ inputs.verification_version }}
          VERIFY_BUILD: ${{ inputs.verification_build }}
        run: |
          $extra = @()
          if ($env:VERIFY_VERSION) {
            if ($env:AWIKI_SOURCE_INTEGRATION -ne '1') { throw 'Verification package requires explicit source dependencies' }
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path 'tests/e2e/configs/windows-https-tenants.json'))
            $b64 = [Convert]::ToBase64String($bytes)
            $digest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
            $extra = @("--build-name=$env:VERIFY_VERSION", "--build-number=$env:VERIFY_BUILD", "--dart-define=AWIKI_BUILTIN_TENANTS_BASE64=$b64", "--dart-define=AWIKI_BUILTIN_TENANTS_SHA256=$digest")
          }
          flutter build windows @extra `
            --release `
            --no-pub `
            --dart-define=AWIKI_APP_SOURCE_REF=${{ github.sha }} `
            --dart-define=AWIKI_IM_CORE_SOURCE_REF=${{ env.WINDOWS_CORE_REF }}

      - name: Real IM Core SQLite and identity Vault initialization
        working-directory: test-awiki-me
        shell: pwsh
        run: |
          # flutter test does not accept --build-name/--build-number. Supply the
          # actual Release executable metadata to this test's PackageInfo seam.
          $version = (Get-Item build/windows/x64/runner/Release/AWikiMe.exe).VersionInfo.ProductVersion
          $parts = $version -split '\+'
          if ($parts.Count -ne 2) { throw 'Release executable package metadata is invalid' }
          flutter test `
            --no-pub `
            --dart-define=AWIKI_E2E=true `
            "--dart-define=AWIKI_TEST_PACKAGE_VERSION=$($parts[0])" `
            "--dart-define=AWIKI_TEST_PACKAGE_BUILD=$($parts[1])" `
            integration_test/im_core_open_smoke_test.dart `
            -d windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run app, single-instance, shutdown, and Credential smoke
        working-directory: test-awiki-me
        shell: pwsh
        run: |
          ./scripts/windows/run_pr_smoke.ps1 `
            -ReleaseDir build/windows/x64/runner/Release

      - name: Package explicit Windows verification installer
        if: github.event_name == 'workflow_dispatch' && inputs.verification_version != ''
        working-directory: test-awiki-me
        shell: pwsh
        env:
          VERIFY_VERSION: ${{ inputs.verification_version }}
          VERIFY_BUILD: ${{ inputs.verification_build }}
        run: ./scripts/windows/package_verification.ps1 -Version $env:VERIFY_VERSION -BuildNumber ([int]$env:VERIFY_BUILD) -CoreRef $env:WINDOWS_CORE_REF

      - name: Upload Windows verification installer
        if: github.event_name == 'workflow_dispatch' && inputs.verification_version != ''
        uses: actions/upload-artifact@v7
        with:
          name: windows-https-verification-installer
          path: test-awiki-me/build/windows-verification/
          if-no-files-found: error
          retention-days: 14

      - name: Build production scope-secret MethodChannel probe
        working-directory: test-awiki-me
        shell: pwsh
        run: |
          flutter build windows `
            --release `
            --no-pub `
            --target tests/e2e/flutter/native/production_scope_restart_probe.dart `
            --dart-define=AWIKI_APP_SOURCE_REF=${{ github.sha }} `
            --dart-define=AWIKI_IM_CORE_SOURCE_REF=${{ env.WINDOWS_CORE_REF }}

      - name: Verify production Credential Manager lifecycle
        working-directory: test-awiki-me
        shell: pwsh
        run: |
          ./scripts/windows/run_scope_secret_integration.ps1 `
            -ReleaseDir build/windows/x64/runner/Release

      - name: Build read-only HTTPS field probe
        if: github.event_name == 'workflow_dispatch' && inputs.verification_version != ''
        working-directory: test-awiki-me
        shell: pwsh
        run: |
          flutter build windows --release --no-pub --target tests/e2e/flutter/native/windows_https_probe.dart --dart-define=AWIKI_APP_SOURCE_REF=${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove installer-only manifests from the separate field probe
        if: github.event_name == 'workflow_dispatch' && inputs.verification_version != ''
        working-directory: test-awiki-me
        shell: pwsh
        run: |
          Remove-Item build/windows/x64/runner/Release/awiki-runtime-manifest.json, build/windows/x64/runner/Release/awiki-runtime-files.txt -ErrorAction SilentlyContinue

      - name: Upload HTTPS field probe
        if: github.event_name == 'workflow_dispatch' && inputs.verification_version != ''
        uses: actions/upload-artifact@v7
        with:
          name: windows-https-field-probe
          path: test-awiki-me/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  package-smoke:
    if: ${{ inputs.package_smoke_run != '' }}
    name: Installed package smoke (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(inputs.package_smoke_target == 'android-arm64' && '[{"target":"android-arm64","runner":"ubuntu-latest"}]' || '[{"target":"macos-arm64","runner":"macos-15"},{"target":"macos-x64","runner":"macos-15-intel"},{"target":"windows-x64","runner":"windows-2022"},{"target":"android-arm64","runner":"ubuntu-latest"}]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require the frozen passed package run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_smoke_run }}
        run: |
          test "$GITHUB_REF" = refs/heads/test/singapore-release-20261012
          test "$PACKAGE_RUN" = 38204358270
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PACKAGE_RUN" > package-run.json
          node -e 'const p=require("./package-run.json"); if(p.conclusion!=="success" || p.head_sha!=="a6c73b0f0b29815d6d5613c9069aaa96a0d6f5fa") process.exit(1)'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_smoke_run }}
          name: awiki-me-packages-b9fcead3-c999-47c7-8244-52dc66725c13
          path: package-smoke-input
      - name: Verify exact packaged bytes
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import crypto from 'node:crypto';
          const m=JSON.parse(fs.readFileSync('package-smoke-input/package-manifest.json'));
          const a=m.artifacts[process.env.PACKAGE_TARGET];
          const b=fs.readFileSync('package-smoke-input/'+a.filename);
          if(b.length!==a.sizeBytes || crypto.createHash('sha256').update(b).digest('hex')!==a.sha256) throw Error('Package integrity mismatch');
          console.log(JSON.stringify({target:process.env.PACKAGE_TARGET,sha256:a.sha256,sizeBytes:a.sizeBytes}));
          JS
      - name: Mount, install and start normal macOS App
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/singapore-app-mount"
          app_copy="$RUNNER_TEMP/singapore-app-installed"
          mkdir -p "$mount" "$app_copy"
          # The manifest owns the filename; do not infer product naming.
          dmg="package-smoke-input/$(node -p 'require("./package-smoke-input/package-manifest.json").artifacts["${{ matrix.target }}"].filename')"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -force || true' EXIT
          app=$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          ditto "$app" "$app_copy/AWikiMe.app"
          codesign --verify --deep --strict "$app_copy/AWikiMe.app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app_copy/AWikiMe.app/Contents/Info.plist")
          expected_arch="${{ matrix.target == 'macos-arm64' && 'arm64' || 'x86_64' }}"
          test "$(uname -m)" = "$expected_arch"
          lipo -archs "$app_copy/AWikiMe.app/Contents/MacOS/$executable" | grep -w "$expected_arch"
          "$app_copy/AWikiMe.app/Contents/MacOS/$executable" > "$RUNNER_TEMP/app-startup.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; hdiutil detach "$mount" -force || true' EXIT
          sleep 15
          kill -0 "$app_pid"
          kill "$app_pid"
          wait "$app_pid" || true
          echo 'Normal signed App installed, native architecture verified, startup remained live for 15 seconds.'
      - name: Install and run existing Windows native smoke
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content package-smoke-input/package-manifest.json | ConvertFrom-Json
          $installer = (Resolve-Path (Join-Path package-smoke-input $manifest.artifacts.'windows-x64'.filename)).Path
          $installDir = Join-Path $env:RUNNER_TEMP 'singapore-normal-app'
          try {
            $p = Start-Process $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="' + $installDir + '"')) -PassThru -Wait
            if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
            ./scripts/windows/run_pr_smoke.ps1 -ReleaseDir $installDir
          } finally {
            $uninstaller = Join-Path $installDir 'unins000.exe'
            if (Test-Path $uninstaller) {
              $p = Start-Process $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
              if ($p.ExitCode -ne 0) { throw "Uninstaller failed: $($p.ExitCode)" }
            }
          }

      - uses: android-actions/setup-android@v3
        if: matrix.target == 'android-arm64'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install and start the arm64 APK through Android native bridge
        if: matrix.target == 'android-arm64'
        shell: bash
        run: |
          set -euo pipefail
          # Android 11 Google APIs x86_64 images support ARM binary translation.
          # Assert the actual system ABI list before using this as arm64 APK evidence.
          # https://android-developers.googleblog.com/2020/03/run-arm-apps-on-android-emulator.html
          sudo apt-get update -qq
          sudo apt-get install -y libpulse0
          sudo chmod 666 /dev/kvm
          sdkmanager 'system-images;android-30;google_apis;x86_64' 'emulator'
          echo no | avdmanager create avd --force --name singapore-arm64-apk --package 'system-images;android-30;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -version
          "$ANDROID_HOME/emulator/emulator" -accel-check
          "$ANDROID_HOME/emulator/emulator" -avd singapore-arm64-apk -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill || true; kill "$emulator_pid" 2>/dev/null || true' EXIT
          sleep 3
          if ! kill -0 "$emulator_pid"; then cat "$RUNNER_TEMP/emulator.log"; exit 1; fi
          timeout 180 adb wait-for-device || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
          booted=false
          for attempt in $(seq 1 180); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then booted=true; break; fi
            sleep 2
          done
          test "$booted" = true
          adb shell getprop ro.product.cpu.abilist | tee "$RUNNER_TEMP/android-abis.txt"
          grep -q arm64-v8a "$RUNNER_TEMP/android-abis.txt"
          apk="package-smoke-input/$(node -p 'require("./package-smoke-input/package-manifest.json").artifacts["android-arm64"].filename')"
          adb install "$apk"
          adb logcat -c
          adb shell monkey -p ai.awiki.awikime -c android.intent.category.LAUNCHER 1
          sleep 15
          pid=$(adb shell pidof ai.awiki.awikime | tr -d '\r')
          test -n "$pid"
          adb logcat -d --pid="$pid" > "$RUNNER_TEMP/app-startup.log"
          if grep -Ei 'FATAL EXCEPTION|Fatal signal|SIGSEGV|UnsatisfiedLink|dlopen failed|native crash' "$RUNNER_TEMP/app-startup.log"; then exit 1; fi
          adb shell am force-stop ai.awiki.awikime
          adb uninstall ai.awiki.awikime
          echo 'Exact signed arm64 APK installed and started through Android ARM native bridge; physical-device acceptance remains manual.'

      - name: Preserve Android startup diagnostics
        if: failure() && matrix.target == 'android-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: singapore-android-startup-diagnostics
          path: |
            ${{ runner.temp }}/emulator.log
            ${{ runner.temp }}/app-startup.log
            ${{ runner.temp }}/android-abis.txt
          if-no-files-found: ignore
          retention-days: 7
