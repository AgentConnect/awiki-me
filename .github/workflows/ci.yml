name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "40 18 * * *"
  workflow_dispatch:
    inputs:
      cli_ref:
        description: Exact 40-character awiki-cli-rs2 commit SHA
        required: true
        type: string
      sdk_dependencies:
        description: Development dependency source (source uses a committed manifest and lock)
        required: false
        default: source
        type: choice
        options: [source, registry]
      validation_only:
        description: Run deterministic validation and native build checks without remote account or OTP scenarios
        required: false
        default: false
        type: boolean
      e2e_case:
        description: Audited remote product suite
        required: true
        default: full
        type: choice
        options: [full, direct, group, attachment, contacts]

permissions:
  contents: read

concurrency:
  group: awiki-me-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: false

env:
  PUB_HOSTED_URL: https://pub.dev
  FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
  AWIKI_SOURCE_INTEGRATION: ${{ (github.event.inputs.sdk_dependencies == 'source' || (github.event_name == 'pull_request' && github.base_ref == 'release/0910' && github.head_ref == 'Feature/registration-account-first')) && '1' || '0' }}
  AWIKI_RELEASE_REGISTRY: ${{ (github.event.inputs.sdk_dependencies == 'source' || (github.event_name == 'pull_request' && github.base_ref == 'release/0910' && github.head_ref == 'Feature/registration-account-first')) && '0' || '1' }}

# release/0910 App code already requires the Core processing-session API.
# Pin only this feature PR; unrelated PRs retain repository-managed defaults.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact CLI / SDK source ref and private repository read token
        env:
          CLI_REF: ${{ github.event.inputs.cli_ref || (github.base_ref == 'release/0910' && github.head_ref == 'Feature/registration-account-first' && 'd51ca16ff697751d04810c417bef5048d6a08e53') || vars.AWIKI_CLI_RS2_REF }}
          SYSTEM_TEST_READ_TOKEN: ${{ secrets.AWIKI_CI_READ_TOKEN }}
        run: |
          [[ "$CLI_REF" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "AWIKI_CLI_RS2_REF (or workflow input) must be an exact commit SHA" >&2
            exit 1
          }
          test -n "$SYSTEM_TEST_READ_TOKEN" || {
            echo "AWIKI_CI_READ_TOKEN is missing; provide Contents: read access to awiki-system-test" >&2
            exit 1
          }

      - name: Checkout AWiki Me
        uses: actions/checkout@v6
        with:
          path: test-awiki-me

      - name: Checkout AWiki CLI / IM Core
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/awiki-cli-rs2
          ref: ${{ github.event.inputs.cli_ref || (github.base_ref == 'release/0910' && github.head_ref == 'Feature/registration-account-first' && 'd51ca16ff697751d04810c417bef5048d6a08e53') || vars.AWIKI_CLI_RS2_REF }}
          token: ${{ github.token }}
          path: awiki-cli-rs2
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libsqlite3-dev xvfb dbus-x11

      - name: Enable Flutter Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Prepare SQLite source for Linux desktop build
        run: |
          for attempt in 1 2 3 4 5 6; do
            curl --fail --location --continue-at - \
              --connect-timeout 20 --max-time 120 \
              --output /tmp/sqlite-autoconf-3520000.tar.gz \
              https://sqlite.org/2026/sqlite-autoconf-3520000.tar.gz && break
            if [ "$attempt" = "6" ]; then exit 1; fi
            sleep 5
          done
          mkdir -p /tmp/awiki-sqlite3
          tar -xzf /tmp/sqlite-autoconf-3520000.tar.gz \
            --strip-components=1 -C /tmp/awiki-sqlite3

      - name: Build debug native IM Core and CLI
        working-directory: awiki-cli-rs2
        run: |
          if [[ "$AWIKI_SOURCE_INTEGRATION" == "1" ]]; then
            python3 scripts/dependencies/build.py --deps source --source-manifest dependencies.source.json --cargo-command build -p im-core-dart -p awiki-cli --locked
            native_root=.artifacts/dependencies/source/target
          else
            python3 scripts/release/registry-build.py -- cargo build -p im-core-dart -p awiki-cli --locked
            native_root=target
          fi
          mkdir -p packages/awiki_im_core/linux/lib
          cp "$native_root/debug/libawiki_im_core.so" \
            packages/awiki_im_core/linux/lib/libawiki_im_core.so

      - name: Install Flutter dependencies
        working-directory: test-awiki-me
        run: flutter pub get

      - name: Verify Linux native Core provenance
        working-directory: test-awiki-me
        run: dart run tool/ensure_linux_im_core.dart --debug

      - name: Checkout unified System Test coordinator
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/awiki-system-test
          ref: a3c0a550a82ec27263db367759e812ab6b160723
          token: ${{ secrets.AWIKI_CI_READ_TOKEN }}
          path: test-awiki-system-test
          persist-credentials: false

      - name: Record exact CLI / SDK source ref
        env:
          CLI_REF: ${{ github.event.inputs.cli_ref || (github.base_ref == 'release/0910' && github.head_ref == 'Feature/registration-account-first' && 'd51ca16ff697751d04810c417bef5048d6a08e53') || vars.AWIKI_CLI_RS2_REF }}
        run: |
          test "$(git -C awiki-cli-rs2 rev-parse HEAD)" = "$CLI_REF"
          git -C awiki-cli-rs2 rev-parse HEAD | tee /tmp/awiki-cli-ref
          git -C test-awiki-system-test rev-parse HEAD

      - name: Dart analyze
        working-directory: test-awiki-me
        run: dart analyze

      - name: Flutter unit/widget/provider gate
        working-directory: test-awiki-me
        run: |
          dart run tests/unit/runner.dart --branch-coverage
          dart run tool/test_coverage_gate.dart

      - name: Validate case catalog and generated documentation
        working-directory: test-awiki-me
        run: dart run tool/validate_test_catalog.dart

      - name: Real desktop smoke (no service dependency)
        working-directory: test-awiki-me
        env:
          AWIKI_SQLITE3_SOURCE_DIR: /tmp/awiki-sqlite3
        run: dart run tests/e2e/runner.dart --case smoke --run-id gha-smoke-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Product manifest orchestration lint only
        working-directory: test-awiki-me
        run: |
          cp tests/e2e/configs/e2e.example.yaml /tmp/awiki-e2e-dry-run.yaml
          sed -i 's/platform: macos/platform: linux/' /tmp/awiki-e2e-dry-run.yaml
          sed -i "s/0000000000000000000000000000000000000000/$(cat /tmp/awiki-cli-ref)/" /tmp/awiki-e2e-dry-run.yaml
          dart run tests/e2e/runner.dart --case full --dry-run \
            --config /tmp/awiki-e2e-dry-run.yaml \
            --run-id gha-dry-run-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run App PR profile alongside legacy gates
        working-directory: test-awiki-system-test
        env:
          AWIKI_SQLITE3_SOURCE_DIR: /tmp/awiki-sqlite3
          AWIKI_CLI_RUST_CARGO_TOOLCHAIN: '1.88.0'
        run: |
          uv sync --locked
          export AWIKI_CLI_SOURCE_REF="$(cat /tmp/awiki-cli-ref)"
          uv run --no-sync awiki-test \
            --profile pr --component app \
            --app-root ../test-awiki-me \
            --cli-root ../awiki-cli-rs2 \
            --run-id gha-pr-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload deterministic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: awiki-me-deterministic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-awiki-me/.e2e/*/*/reports/**
            test-awiki-me/.e2e/native-core/*-provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload unified profile report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: awiki-unified-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-awiki-system-test/.artifacts/awiki-test/
          if-no-files-found: error
          retention-days: 14

  cross-repository-contracts:
    name: Cross-repository System contracts
    runs-on: ubuntu-latest
    steps:
      - name: Require exact CLI / SDK source ref and private repository read token
        env:
          CLI_REF: ${{ github.event.inputs.cli_ref || (github.base_ref == 'release/0910' && github.head_ref == 'Feature/registration-account-first' && 'd51ca16ff697751d04810c417bef5048d6a08e53') || vars.AWIKI_CLI_RS2_REF }}
          SYSTEM_TEST_READ_TOKEN: ${{ secrets.AWIKI_CI_READ_TOKEN }}
        run: |
          [[ "$CLI_REF" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "AWIKI_CLI_RS2_REF (or workflow input) must be an exact commit SHA" >&2
            exit 1
          }
          test -n "$SYSTEM_TEST_READ_TOKEN" || {
            echo "AWIKI_CI_READ_TOKEN is missing; provide Contents: read access to awiki-system-test, user-service, and awiki-web" >&2
            exit 1
          }

      - name: Checkout AWiki Me
        uses: actions/checkout@v6
        with:
          path: test-awiki-me

      - name: Checkout AWiki CLI / IM Core
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/awiki-cli-rs2
          ref: ${{ github.event.inputs.cli_ref || (github.base_ref == 'release/0910' && github.head_ref == 'Feature/registration-account-first' && 'd51ca16ff697751d04810c417bef5048d6a08e53') || vars.AWIKI_CLI_RS2_REF }}
          token: ${{ github.token }}
          path: awiki-cli-rs2
          persist-credentials: false

      - name: Checkout unified System Test coordinator
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/awiki-system-test
          ref: a3c0a550a82ec27263db367759e812ab6b160723
          token: ${{ secrets.AWIKI_CI_READ_TOKEN }}
          path: test-awiki-system-test
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Checkout pinned DSH contract source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/dsh-awiki
          ref: f4b181f22c58bcc1a76f8099882ddc5191823eab
          path: dsh-awiki
          persist-credentials: false

      - name: Checkout pinned User Service contract source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/user-service
          ref: 831cd43587baebe98f6aff9972d00e88850cdcd7
          token: ${{ secrets.AWIKI_CI_READ_TOKEN }}
          path: user-service
          persist-credentials: false

      - name: Checkout pinned Web contract source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/awiki-web
          ref: e0b9bf029338aa914169523ef09a729f58d8b028
          token: ${{ secrets.AWIKI_CI_READ_TOKEN }}
          path: awiki-web
          persist-credentials: false

      - name: Checkout pinned Desktop contract source
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/deepseek-harness-desktop
          ref: 82c36f3d3c850fe376e8cc5de3d3e1d07ab59ccf
          path: deepseek-harness-desktop
          persist-credentials: false

      # Match the pinned System Test coordinator's update-wire fixtures.
      - name: Setup Node for cross-repository contracts
        uses: actions/setup-node@v6
        with:
          node-version: '24.12.0'

      - name: Install frozen DSH contract dependencies
        working-directory: dsh-awiki
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Install frozen Desktop contract dependencies
        working-directory: deepseek-harness-desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          node scripts/prepare-runtime-inputs.mjs
          corepack yarn install --immutable --mode=skip-build

      - name: Prepare canonical App source path for contracts
        run: ln -s test-awiki-me awiki-me

      - name: Run cross-repository System PR contracts
        working-directory: test-awiki-system-test
        env:
          AWIKI_CLI_RUST_CARGO_TOOLCHAIN: '1.88.0'
        run: |
          uv sync --locked
          export AWIKI_CLI_SOURCE_REF="$(git -C ../awiki-cli-rs2 rev-parse HEAD)"
          uv run --no-sync awiki-test \
            --profile pr --component system \
            --app-root ../test-awiki-me \
            --cli-root ../awiki-cli-rs2 \
            --run-id gha-contracts-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload unified profile report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: awiki-system-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-awiki-system-test/.artifacts/awiki-test/
          if-no-files-found: error
          retention-days: 14

  remote-product:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.validation_only)
    needs: [validate, cross-repository-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Require exact ref and remote account pool secrets
        env:
          CLI_REF: ${{ github.event.inputs.cli_ref || (github.base_ref == 'release/0910' && github.head_ref == 'Feature/registration-account-first' && 'd51ca16ff697751d04810c417bef5048d6a08e53') || vars.AWIKI_CLI_RS2_REF }}
          E2E_PHONE: ${{ secrets.AWIKI_E2E_OTP_PHONE }}
          E2E_OTP: ${{ secrets.AWIKI_E2E_OTP_CODE }}
          APP_HANDLE: ${{ secrets.AWIKI_E2E_APP_HANDLE }}
          CLI_HANDLE: ${{ secrets.AWIKI_E2E_CLI_HANDLE }}
        run: |
          [[ "$CLI_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          test -n "$E2E_PHONE" && test -n "$E2E_OTP"
          test -n "$APP_HANDLE" && test -n "$CLI_HANDLE"

      - uses: actions/checkout@v6
        with:
          path: test-awiki-me

      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/awiki-cli-rs2
          ref: ${{ github.event.inputs.cli_ref || (github.base_ref == 'release/0910' && github.head_ref == 'Feature/registration-account-first' && 'd51ca16ff697751d04810c417bef5048d6a08e53') || vars.AWIKI_CLI_RS2_REF }}
          token: ${{ github.token }}
          path: awiki-cli-rs2
          persist-credentials: false

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@1.88.0

      - name: Install Linux desktop dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libsecret-1-dev libsqlite3-dev xvfb dbus-x11
          flutter config --enable-linux-desktop

      - name: Prepare SQLite source
        run: |
          curl --fail --location --connect-timeout 20 --max-time 180 \
            --output /tmp/sqlite.tar.gz \
            https://sqlite.org/2026/sqlite-autoconf-3520000.tar.gz
          mkdir -p /tmp/awiki-sqlite3
          tar -xzf /tmp/sqlite.tar.gz --strip-components=1 -C /tmp/awiki-sqlite3

      - name: Build audited debug artifacts
        working-directory: awiki-cli-rs2
        run: |
          if [[ "$AWIKI_SOURCE_INTEGRATION" == "1" ]]; then
            python3 scripts/dependencies/build.py --deps source --source-manifest dependencies.source.json --cargo-command build -p im-core-dart -p awiki-cli --locked
            native_root=.artifacts/dependencies/source/target
          else
            python3 scripts/release/registry-build.py -- cargo build -p im-core-dart -p awiki-cli --locked
            native_root=target
          fi
          mkdir -p packages/awiki_im_core/linux/lib
          cp "$native_root/debug/libawiki_im_core.so" \
            packages/awiki_im_core/linux/lib/libawiki_im_core.so

      - name: Install Flutter dependencies
        working-directory: test-awiki-me
        run: flutter pub get

      - name: Verify Linux native Core provenance
        working-directory: test-awiki-me
        run: dart run tool/ensure_linux_im_core.dart --debug

      - name: Write secret-backed awiki.info config
        working-directory: test-awiki-me
        env:
          CLI_REF: ${{ github.event.inputs.cli_ref || (github.base_ref == 'release/0910' && github.head_ref == 'Feature/registration-account-first' && 'd51ca16ff697751d04810c417bef5048d6a08e53') || vars.AWIKI_CLI_RS2_REF }}
          E2E_PHONE: ${{ secrets.AWIKI_E2E_OTP_PHONE }}
          E2E_OTP: ${{ secrets.AWIKI_E2E_OTP_CODE }}
          APP_HANDLE: ${{ secrets.AWIKI_E2E_APP_HANDLE }}
          CLI_HANDLE: ${{ secrets.AWIKI_E2E_CLI_HANDLE }}
        run: |
          mkdir -p .e2e/ci
          python3 - <<'PY'
          import json, os
          config = {
              "platform": "linux",
              "service": {
                  "baseUrl": "https://awiki.info",
                  "userServiceUrl": "https://awiki.info",
                  "messageServiceUrl": "https://awiki.info",
                  "messageServiceWsUrl": "wss://awiki.info/im/ws",
                  "didDomain": "awiki.info",
                  "anpServiceUrl": "https://awiki.info/anp-im/rpc",
                  "anpServiceDid": "did:wba:awiki.info",
              },
              "otp": {"phone": os.environ["E2E_PHONE"], "code": os.environ["E2E_OTP"]},
              "accounts": {
                  "appUser": {"handle": os.environ["APP_HANDLE"]},
                  "cliPeer": {"handle": os.environ["CLI_HANDLE"]},
              },
              "cliPeer": {
                  "binary": "../awiki-cli-rs2/" + (".artifacts/dependencies/source/target" if os.environ.get("AWIKI_SOURCE_INTEGRATION") == "1" else "target") + "/debug/awiki-cli",
                  "sourceRef": os.environ["CLI_REF"],
              },
          }
          with open(".e2e/ci/remote.json", "w", encoding="utf-8") as handle:
              json.dump(config, handle)
          PY

      - name: Run real App to CLI product gate against awiki.info
        working-directory: test-awiki-me
        env:
          AWIKI_SQLITE3_SOURCE_DIR: /tmp/awiki-sqlite3
        run: |
          test "$(git -C ../awiki-cli-rs2 rev-parse HEAD)" = \
            "${{ github.event.inputs.cli_ref || (github.base_ref == 'release/0910' && github.head_ref == 'Feature/registration-account-first' && 'd51ca16ff697751d04810c417bef5048d6a08e53') || vars.AWIKI_CLI_RS2_REF }}"
          dart run tests/e2e/runner.dart \
            --case "${{ github.event.inputs.e2e_case || 'full' }}" \
            --config .e2e/ci/remote.json \
            --run-id gha-remote-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload real product reports and residual ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: awiki-me-remote-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-awiki-me/.e2e/*/*/reports/**
            test-awiki-me/.e2e/native-core/*-provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  windows-pr:
    name: Windows x64 build and native smoke
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      WINDOWS_CORE_REF: ${{ github.event.inputs.cli_ref || (github.base_ref == 'release/0910' && github.head_ref == 'Feature/registration-account-first' && 'd51ca16ff697751d04810c417bef5048d6a08e53') || vars.AWIKI_CLI_RS2_WINDOWS_REF || vars.AWIKI_CLI_RS2_REF }}
    steps:
      - name: Require exact Core source ref
        shell: bash
        run: |
          [[ "$WINDOWS_CORE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "AWIKI_CLI_RS2_WINDOWS_REF must be an exact Core commit SHA" >&2
            exit 1
          }

      - name: Checkout AWiki Me
        uses: actions/checkout@v6
        with:
          path: test-awiki-me

      - name: Checkout pinned CLI / IM Core
        uses: actions/checkout@v6
        with:
          repository: AgentConnect/awiki-cli-rs2
          ref: ${{ env.WINDOWS_CORE_REF }}
          token: ${{ github.token }}
          path: awiki-cli-rs2
          persist-credentials: false

      - name: Verify exact CLI / IM Core checkout
        shell: pwsh
        run: |
          $actual = (git -C awiki-cli-rs2 rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:WINDOWS_CORE_REF) {
            throw "Core checkout is $actual, expected $env:WINDOWS_CORE_REF"
          }

      - name: Check Windows native build entrypoint
        working-directory: awiki-cli-rs2
        shell: pwsh
        run: ./scripts/flutter/test-build-windows.ps1

      - name: Setup Flutter 3.44.0
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Setup Rust 1.88.0
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Run IM Core Rust host tests
        working-directory: awiki-cli-rs2
        shell: pwsh
        run: |
          $cargoArgs = @('+1.88.0', 'test', '-p', 'im-core-dart', '--locked', '--no-default-features', '--features', 'blocking,sqlite,http,windows,identity-native-anp')
          if ($env:AWIKI_SOURCE_INTEGRATION -eq '1') {
            python3 scripts/dependencies/build.py --deps source --source-manifest dependencies.source.json --cargo-command @cargoArgs
          } else {
            python3 scripts/release/registry-build.py -- cargo @cargoArgs
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify x64 native IM Core
        working-directory: awiki-cli-rs2
        shell: pwsh
        run: ./scripts/flutter/build-windows.ps1

      - name: Run IM Core Flutter loader tests
        working-directory: awiki-cli-rs2/packages/awiki_im_core
        shell: pwsh
        run: |
          flutter pub get
          flutter test --no-pub test/native_library_loader_test.dart

      - name: Install AWiki Me dependencies
        working-directory: test-awiki-me
        shell: pwsh
        run: flutter pub get

      - name: Run Windows runner and package contract tests
        working-directory: test-awiki-me
        shell: pwsh
        run: |
          flutter test --no-pub tests/unit/windows_runner_configuration_test.dart
          flutter test --no-pub tests/unit/windows_installer_configuration_test.dart
          flutter test --no-pub tests/unit/package_manifest_test.dart
          flutter test --no-pub tests/unit/windows_scope_secret_integration_configuration_test.dart

      - name: Build Windows Debug
        working-directory: test-awiki-me
        shell: pwsh
        run: |
          flutter build windows `
            --debug `
            --no-pub `
            --dart-define=AWIKI_APP_SOURCE_REF=${{ github.sha }} `
