# Singapore staging App + CLI E2E target. Copy to an ignored *.local.yaml and
# replace account-pool values plus the exact CLI source revision.

platform: macos

service:
  baseUrl: https://anpclaw.com
  userServiceUrl: https://anpclaw.com
  messageServiceUrl: https://anpclaw.com
  messageServiceWsUrl: wss://anpclaw.com/im/ws
  didDomain: anpclaw.com
  anpServiceUrl: https://anpclaw.com/anp-im/rpc
  anpServiceDid: did:wba:anpclaw.com

otp:
  phone: "+8610000000000"
  code: "000000"

accounts:
  appUser:
    handle: replace-with-unused-app-handle
  cliPeer:
    handle: replace-with-unused-cli-handle

cliPeer:
  binary: ../awiki-cli-rs2/target/release/awiki-cli
  sourceRef: "0000000000000000000000000000000000000000"
